<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicSynth Pro - Sunset Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #fffaf0;
            --orange-prime: #f97316;
            --orange-soft: #ffedd5;
            --orange-border: #fdba74;
            --text-dark: #431407;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
        }

        .app-shell {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 1.25rem;
            padding: 1.25rem;
            height: 100vh;
        }

        .ui-panel {
            background: #ffffff;
            border: 2px solid var(--orange-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px -10px rgba(124, 45, 18, 0.1);
        }

        /* Fixed-height Input Area */
        .input-container {
            height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .input-container::-webkit-scrollbar { width: 4px; }
        .input-container::-webkit-scrollbar-thumb { background: var(--orange-border); border-radius: 10px; }

        .logic-slot {
            background: #fff;
            border: 1.5px solid #f1f5f9;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            padding: 0 0.75rem;
            transition: all 0.2s;
        }
        .logic-slot:focus-within {
            border-color: var(--orange-prime);
            background: var(--bg-cream);
        }

        .slot-id {
            font-size: 11px;
            font-weight: 800;
            color: var(--orange-prime);
            width: 25px;
            opacity: 0.6;
        }

        .logic-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-dark);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            width: 100%;
            padding: 12px 0;
        }

        /* Buttons */
        .btn {
            border-radius: 14px;
            font-weight: 700;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-prime {
            background: var(--orange-prime);
            color: white;
            box-shadow: 0 4px 0 #9a3412;
        }
        .btn-prime:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #9a3412;
        }
        .btn-sub {
            background: var(--orange-soft);
            color: var(--orange-prime);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Truth Table with Sticky Scroll */
        .table-viewport {
            flex-grow: 1;
            overflow-y: auto;
            position: relative;
            background: white;
            scroll-behavior: smooth;
        }
        .table-viewport::-webkit-scrollbar { width: 6px; }
        .table-viewport::-webkit-scrollbar-thumb { background: var(--orange-soft); border-radius: 10px; }

        #truthTable { width: 100%; border-collapse: separate; border-spacing: 0; }
        #truthTable th {
            background: #fff;
            color: var(--orange-prime);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 14px;
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1.5px solid var(--orange-soft);
        }
        #truthTable td {
            padding: 12px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            border-bottom: 1px solid #fffaf0;
        }

        /* The Moving Playhead Row */
        .row-active td {
            background: var(--orange-prime) !important;
            color: white !important;
            transition: background 0.05s;
        }
        .row-active span { color: white !important; }

        .val-1 { color: var(--orange-prime); font-weight: 800; }
        .val-0 { color: #e2e8f0; }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- Sidebar -->
        <div class="flex flex-col gap-4 overflow-hidden">
            <div class="flex justify-between items-center px-1">
                <h1 class="text-lg font-black tracking-tighter text-orange-600 uppercase">LogicSynth</h1>
                <button onclick="addFunction()" class="p-1 hover:bg-orange-100 rounded-full transition-colors">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-orange-600"></i>
                </button>
            </div>

            <div class="ui-panel p-4">
                <div id="functionContainer" class="input-container">
                    <!-- Dynamic Slots -->
                </div>
                <div class="mt-4 pt-4 border-t border-orange-50">
                    <button onclick="compile()" class="w-full py-4 btn btn-prime">COMPILE CIRCUIT</button>
                </div>
            </div>

            <div class="ui-panel p-5">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <span class="text-[10px] font-black uppercase text-orange-300 block">Tempo</span>
                        <span class="text-sm font-bold">110 BPM</span>
                    </div>
                    <div id="statusTag" class="px-3 py-1 bg-orange-50 text-[10px] font-black text-orange-400 rounded-full uppercase">Standby</div>
                </div>

                <div class="flex gap-2 mb-4">
                    <button onclick="step(-1)" class="flex-1 py-4 btn btn-sub"><i data-lucide="chevron-left"></i></button>
                    <button id="playBtn" disabled onclick="togglePlay()" class="flex-[2] py-4 btn btn-prime">
                        <i id="playIcon" data-lucide="play" class="fill-current"></i>
                    </button>
                    <button onclick="step(1)" class="flex-1 py-4 btn btn-sub"><i data-lucide="chevron-right"></i></button>
                </div>

                <!-- Consolidated Action Bar -->
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="save()" class="py-2 btn btn-sub text-[9px]"><i data-lucide="save" class="w-3 h-3"></i> Store</button>
                    <button id="dlBtn" disabled onclick="record()" class="py-2 btn btn-sub text-[9px]"><i data-lucide="download" class="w-3 h-3"></i> Export</button>
                </div>
            </div>
        </div>

        <!-- Monitoring -->
        <div class="flex flex-col gap-4 overflow-hidden">
            <div class="flex justify-between items-center px-2">
                <div class="flex gap-6">
                    <div>
                        <span class="text-[9px] font-black text-orange-300 uppercase block">Scale</span>
                        <span class="text-xs font-bold text-orange-800">C Major</span>
                    </div>
                    <div>
                        <span class="text-[9px] font-black text-orange-300 uppercase block">Permutations</span>
                        <span id="permLabel" class="text-xs font-bold text-orange-800">0</span>
                    </div>
                </div>
            </div>

            <div class="ui-panel flex-grow">
                <div id="tableViewport" class="table-viewport">
                    <table id="truthTable">
                        <thead>
                            <tr id="tableHeader"><th>Signals</th></tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // --- Clean Audio Engine ---
        const piano = new Tone.Sampler({
            urls: {
                A0: "A0.mp3", C1: "C1.mp3", A1: "A1.mp3", C2: "C2.mp3", 
                A2: "A2.mp3", C3: "C3.mp3", A3: "A3.mp3", C4: "C4.mp3",
                A4: "A4.mp3", C5: "C5.mp3", A5: "A5.mp3", C6: "C6.mp3"
            },
            release: 1,
            baseUrl: "https://tonejs.github.io/audio/salamander/"
        }).toDestination();

        const recorder = new Tone.Recorder();
        piano.connect(recorder);
        const dest = Tone.context.createMediaStreamDestination();
        piano.connect(dest);

        let activeSeq = null;
        let isPlaying = false;
        let logicData = [];
        let currentIndex = 0;
        let currentVars = [];
        const scale = ["C3", "D3", "E3", "F3", "G3", "A3", "B3", "C4"];

        function addFunction(val = "") {
            const container = document.getElementById('functionContainer');
            const count = container.children.length;
            if (count >= 8) return;

            const div = document.createElement('div');
            div.className = "logic-slot";
            div.innerHTML = `
                <span class="slot-id">F${count + 1}</span>
                <input type="text" value="${val}" class="logic-input" placeholder="e.g. A & B | !C" spellcheck="false">
                <button onclick="this.parentElement.remove(); sync();" class="text-orange-200 hover:text-orange-500 ml-1">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            `;
            container.appendChild(div);
            lucide.createIcons();
            container.scrollTop = container.scrollHeight;
        }

        function sync() {
            document.querySelectorAll('.slot-id').forEach((el, i) => el.innerText = `F${i+1}`);
        }

        function evalLogic(expr, mapping) {
            try {
                let s = expr.toUpperCase().replace(/&/g, ' && ').replace(/\|/g, ' || ').replace(/!/g, ' ! ').replace(/\^/g, ' ^ ');
                for (const [v, val] of Object.entries(mapping)) {
                    s = s.replace(new RegExp(`\\b${v}\\b`, 'g'), val);
                }
                return eval(s) ? 1 : 0;
            } catch (e) { return 0; }
        }

        async function compile() {
            stop();
            const inputs = Array.from(document.querySelectorAll('.logic-input'));
            const exprs = inputs.map(i => i.value);
            currentVars = [...new Set(exprs.join(' ').match(/[A-H]/g) || [])].sort();
            
            if (currentVars.length === 0) return;

            const rowCount = Math.pow(2, currentVars.length);
            const tableBody = document.getElementById('tableBody');
            const tableHeader = document.getElementById('tableHeader');
            
            tableHeader.innerHTML = `<tr><th class="border-r border-orange-100">${currentVars.join('')}</th>${exprs.map((_, i) => `<th>F${i+1}</th>`).join('')}</tr>`;
            tableBody.innerHTML = '';
            logicData = exprs.map(() => []);

            for (let i = 0; i < rowCount; i++) {
                const bits = i.toString(2).padStart(currentVars.length, '0').split('').map(Number);
                const mapping = {};
                currentVars.forEach((v, idx) => mapping[v] = bits[idx]);

                const results = exprs.map((expr, eIdx) => {
                    const res = evalLogic(expr, mapping);
                    logicData[eIdx].push(res);
                    return res;
                });

                const row = document.createElement('tr');
                row.id = `row-${i}`;
                let html = `<td class="border-r border-orange-50 text-slate-300">${bits.join('')}</td>`;
                results.forEach(res => html += `<td><span class="${res ? 'val-1' : 'val-0'}">${res}</span></td>`);
                row.innerHTML = html;
                tableBody.appendChild(row);
            }

            document.getElementById('permLabel').innerText = rowCount;
            document.getElementById('playBtn').disabled = false;
            document.getElementById('dlBtn').disabled = false;
            initSequence();
        }

        function playRow(index, time = Tone.now()) {
            logicData.forEach((col, cIdx) => {
                if (col[index] === 1) {
                    const note = scale[cIdx % scale.length];
                    piano.triggerAttackRelease(note, "8n", time, 0.5);
                }
            });
            highlight(index);
        }

        // --- Fixed Center Scroll Logic ---
        function highlight(index) {
            document.querySelectorAll('.row-active').forEach(r => r.classList.remove('row-active'));
            const row = document.getElementById(`row-${index}`);
            const viewport = document.getElementById('tableViewport');
            
            if (row && viewport) {
                row.classList.add('row-active');
                
                const vHeight = viewport.clientHeight;
                const rTop = row.offsetTop;
                const rHeight = row.offsetHeight;
                
                // Perfect center target
                const targetScroll = rTop - (vHeight / 2) + (rHeight / 2);
                viewport.scrollTo({ top: targetScroll, behavior: 'smooth' });
            }
        }

        function initSequence() {
            if (activeSeq) activeSeq.dispose();
            const events = Array.from({length: logicData[0].length}, (_, i) => i);
            activeSeq = new Tone.Sequence((time, index) => {
                Tone.Draw.schedule(() => {
                    currentIndex = index;
                    playRow(index, time);
                }, time);
            }, events, "8n");
            Tone.Transport.bpm.value = 110;
        }

        async function togglePlay() {
            await Tone.start();
            if (isPlaying) {
                Tone.Transport.pause();
                document.getElementById('statusTag').innerText = "Paused";
            } else {
                activeSeq.start(0);
                Tone.Transport.start();
                document.getElementById('statusTag').innerText = "Playing";
            }
            isPlaying = !isPlaying;
            updateUI();
        }

        function stop() {
            Tone.Transport.stop();
            if (activeSeq) activeSeq.stop();
            isPlaying = false;
            document.getElementById('statusTag').innerText = "Standby";
            updateUI();
        }

        function step(dir) {
            if (!logicData.length) return;
            const len = logicData[0].length;
            currentIndex = (currentIndex + dir + len) % len;
            playRow(currentIndex);
        }

        function updateUI() {
            const icon = document.getElementById('playIcon');
            icon.setAttribute('data-lucide', isPlaying ? 'pause' : 'play');
            lucide.createIcons();
        }

        function record() {
            if (!activeSeq) return;
            const recorder = new MediaRecorder(dest.stream);
            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = "logicsynth_sunset.webm"; a.click();
            };
            recorder.start();
            Tone.Transport.start();
            activeSeq.start(0);
            const dur = (60 / 110) * (logicData[0].length / 2) * 1000;
            setTimeout(() => { recorder.stop(); stop(); }, dur + 500);
        }

        function save() {
            const inputs = Array.from(document.querySelectorAll('.logic-input')).map(i => i.value);
            localStorage.setItem('ls_sunset_save', JSON.stringify(inputs));
        }

        window.onload = () => {
            const saved = localStorage.getItem('ls_sunset_save');
            if (saved) {
                JSON.parse(saved).forEach(v => addFunction(v));
            } else {
                addFunction("A & B");
                addFunction("!B ^ C");
                addFunction("A | C");
            }
            compile();
        };
    </script>
</body>
</html>
